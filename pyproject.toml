[project]
name = "drone-simulation"
version = "0.1.0"
description = "PX4 SITL / Gazebo / MAVSDK drone simulation harness"
requires-python = ">=3.11"
dependencies = [
    "mavsdk>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "bandit>=1.7",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["missions", "services", "dao"]
addopts = "-ra"

[tool.coverage.run]
source = ["missions", "services", "dao"]
omit = [
    "*_test.py",
    "missions/sitl_connectivity_runner.py",
    "services/mavsdk_live_gateway.py",
]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.bandit]
exclude_dirs = ["tests"]
exclude = ["*_test.py"]
skips = ["B101"]